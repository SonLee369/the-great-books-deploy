<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Great Books — a personal card catalog</title>
<meta name="description" content="A personal website of books read and reviewe.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="drawer">
  <header class="masthead">
    <div>
      <h1>The Great Books</h1>
      <p class="tagline">let the reading begin</p>
    </div>
    <div class="drawer-meta" id="drawerMeta">
      — books —
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Search title or author…" aria-label="Search title or author">
    <select id="tagFilter" aria-label="Filter by tag">
      <option value="">All shelves</option>
    </select>
    <select id="sortOrder" aria-label="Sort order">
      <option value="date-desc">Newest read first</option>
      <option value="date-asc">Oldest read first</option>
      <option value="rating-desc">Highest rated</option>
      <option value="title-asc">Title A–Z</option>
    </select>
    <span class="count" id="resultCount"></span>
  </div>

  <main class="catalog" id="catalog">
    <p class="empty">Loading the shelves…</p>
  </main>

  <footer class="site-footer">
    <span>Card catalog, digitized.</span>
    <a href="admin.html">Admin sign-in</a>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="Close review">×</button>
    <img class="cover" id="modalCover" alt="" hidden>
    <p class="call-no" id="modalCallNo"></p>
    <h2 id="modalTitle"></h2>
    <p class="author" id="modalAuthor"></p>
    <span class="stars" id="modalStars"></span>
    <div class="review-body" id="modalReview"></div>
    <div class="tags" id="modalTags"></div>
    <div class="stamp modal-stamp" id="modalStamp"></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
