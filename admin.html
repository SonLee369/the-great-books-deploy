<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin sign-in — Reading Log</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="admin-shell">

  <!-- LOGIN VIEW -->
  <section id="loginView">
    <h1>Admin sign-in</h1>
    <p class="sub">add · edit · remove reviews</p>
    <div class="panel">
      <div id="loginMsg"></div>
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Sign in</button>
      </form>
    </div>
    <p style="font-family:'IBM Plex Mono',monospace; font-size:11px; opacity:.6;">
      No account yet? Create one for yourself in the Firebase console under
      Authentication → Users. See README.md for the exact steps.
    </p>
    <p><a href="index.html" style="font-family:'IBM Plex Mono',monospace; font-size:12px; opacity:.7;">← Back to the catalog</a></p>
  </section>

  <!-- ADMIN VIEW (shown after sign-in) -->
  <section id="adminView" class="hidden">
    <h1>Reading Log</h1>
    <p class="sub" id="whoami"></p>

    <div class="panel">
      <h2 id="formTitle">Add a book</h2>
      <div id="formMsg"></div>
      <form id="bookForm">
        <input type="hidden" id="bookId">
        <div class="row2">
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" required>
          </div>
          <div class="field">
            <label for="author">Author</label>
            <input type="text" id="author" required>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="rating">Rating</label>
            <select id="rating">
              <option value="5">★★★★★ — 5</option>
              <option value="4">★★★★☆ — 4</option>
              <option value="3">★★★☆☆ — 3</option>
              <option value="2">★★☆☆☆ — 2</option>
              <option value="1">★☆☆☆☆ — 1</option>
            </select>
          </div>
          <div class="field">
            <label for="dateRead">Date finished</label>
            <input type="date" id="dateRead" required>
          </div>
        </div>
        <div class="field">
          <label for="tags">Shelves / tags (comma separated)</label>
          <input type="text" id="tags" placeholder="fiction, sci-fi, favorites">
        </div>
        <div class="field">
          <label for="coverUrl">Cover image URL (optional)</label>
          <input type="url" id="coverUrl" placeholder="https://…">
        </div>
        <div class="field">
          <label for="review">Your review</label>
          <textarea id="review" required placeholder="What did you think?"></textarea>
        </div>
        <button type="submit" class="btn" id="saveBtn">Save to catalog</button>
        <button type="button" class="btn secondary hidden" id="cancelEditBtn">Cancel edit</button>
      </form>
    </div>

    <div class="panel">
      <h2>Your reviews (<span id="bookCount">0</span>)</h2>
      <div class="admin-list" id="adminList"></div>
    </div>

    <button class="btn secondary" id="logoutBtn">Sign out</button>
    <a href="index.html" style="font-family:'IBM Plex Mono',monospace; font-size:12px; opacity:.7; margin-left:16px;">View public catalog →</a>
  </section>

</div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
